<!-- Course Assistant Chatbot -->
<div class="course-chatbot-container">
    <div class="chatbot-toggle" id="courseChatbotToggle">
        <i class="fas fa-robot"></i>
    </div>
    
    <div class="chatbot-popup" id="courseChatbotPopup">
        <div class="chatbot-header bg-success">
            <h6 class="mb-0">
                <i class="fas fa-graduation-cap me-2"></i>Course Assistant
            </h6>
            <button class="btn-close btn-close-white" id="courseChatbotClose"></button>
        </div>
        <div class="chatbot-messages" id="courseChatbotMessages">
            <div class="chatbot-message bot-message">
                <i class="fas fa-robot me-2"></i>
                Hi! I'm your Course Assistant. Ask me anything about this video or course content!
            </div>
        </div>
        <div class="chatbot-input">
            <div class="input-group">
                <input type="text" class="form-control" id="courseChatbotInput" placeholder="Ask about this course content...">
                <button class="btn btn-success" id="courseChatbotSend">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
