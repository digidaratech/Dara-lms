{% extends "admin/base.html" %}

{% block title %}Admin Profile - EduFlow LMS{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Admin Profile</h1>
    </div>

    <!-- Profile Content -->
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Profile Information</h6>
                </div>
                <div class="card-body">
                    <form>
                        <div class="form-group">
                            <label for="adminName">Admin Name</label>
                            <input type="text" class="form-control" id="adminName" value="System Administrator">
                        </div>
                        <div class="form-group">
                            <label for="adminEmail">Email Address</label>
                            <input type="email" class="form-control" id="adminEmail" value="admin@digidara.com" readonly>
                        </div>
                        <div class="form-group">
                            <label for="adminRole">Role</label>
                            <input type="text" class="form-control" id="adminRole" value="Super Administrator" readonly>
                        </div>
                        <div class="form-group">
                            <label for="lastLogin">Last Login</label>
                            <input type="text" class="form-control" id="lastLogin" value="{{ session.get('admin_email', 'N/A') }}" readonly>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Account Status</h6>
                </div>
                <div class="card-body">
                    <div class="text-center">
                        <i class="fas fa-user-shield fa-3x text-primary mb-3"></i>
                        <h5>Administrator Account</h5>
                        <p class="text-success">Active</p>
                        <small class="text-muted">Full system access</small>
                    </div>
                </div>
            </div>
            
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Quick Links</h6>
                </div>
                <div class="card-body">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary btn-block mb-2">
                        <i class="fas fa-tachometer-alt fa-sm text-white-50 me-2"></i>Dashboard
                    </a>
                    <a href="{{ url_for('admin_courses') }}" class="btn btn-info btn-block mb-2">
                        <i class="fas fa-book fa-sm text-white-50 me-2"></i>Manage Courses
                    </a>
                    <a href="{{ url_for('admin_users') }}" class="btn btn-success btn-block">
                        <i class="fas fa-users fa-sm text-white-50 me-2"></i>Manage Users
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
