{% extends "admin/base.html" %}

{% block title %}Admin Settings - EduFlow LMS{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Settings</h1>
    </div>

    <!-- Settings Content -->
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">System Settings</h6>
                </div>
                <div class="card-body">
                    <form>
                        <div class="form-group">
                            <label for="siteName">Site Name</label>
                            <input type="text" class="form-control" id="siteName" value="EduFlow LMS">
                        </div>
                        <div class="form-group">
                            <label for="siteDescription">Site Description</label>
                            <textarea class="form-control" id="siteDescription" rows="3">Learning Management System</textarea>
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">Contact Email</label>
                            <input type="email" class="form-control" id="contactEmail" value="admin@digidara.com">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Quick Actions</h6>
                </div>
                <div class="card-body">
                    <a href="{{ url_for('admin_create_course') }}" class="btn btn-primary btn-block mb-2">
                        <i class="fas fa-plus fa-sm text-white-50 me-2"></i>Create New Course
                    </a>
                    <a href="{{ url_for('admin_video_upload') }}" class="btn btn-info btn-block mb-2">
                        <i class="fas fa-upload fa-sm text-white-50 me-2"></i>Upload Video
                    </a>
                    <a href="{{ url_for('admin_analytics') }}" class="btn btn-success btn-block">
                        <i class="fas fa-chart-bar fa-sm text-white-50 me-2"></i>View Analytics
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
